<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Crayon Cloud app icon: the same macOS-style rounded square as ButterKnife, in a storm-blue sky, with a white
       cloud embossed into the surface raining a dot matrix of red, green and blue. Source of truth for every size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6f96"/>
      <stop offset="1" stop-color="#252b45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6e4"/>
    </linearGradient>
    <!-- Cloud silhouette in its own 420x220 space as ONE path so the emboss strokes can be clipped to it. -->
    <path id="cloud" d="M78 206 C 26 206, 22 132, 76 128 C 78 78, 148 56, 186 92 C 208 40, 306 42, 322 106 C 380 98, 402 174, 356 206 Z"/>
    <clipPath id="cloudClip"><use href="#cloud"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="drop" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background squircle: 824px centred, corner radius ~22.5% like macOS icons. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g transform="translate(512 470) scale(1.62) translate(-212 -160)">
    <!-- rain: soft glow under crisp dots -->
    <g filter="url(#glow)" opacity="0.7">
    <circle cx="118" cy="232" r="8.5" fill="#ff4b4b" opacity="1.0"/>
    <circle cx="118" cy="262" r="8.5" fill="#ff4b4b" opacity="0.9"/>
    <circle cx="118" cy="292" r="8.5" fill="#ff4b4b" opacity="0.75"/>
