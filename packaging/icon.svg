    <circle cx="358" cy="352" r="8.5" fill="#ff4b4b" opacity="0.42"/>
    </g>

    <!-- cloud: drop shadow, face, then highlight and shadow strokes clipped to the silhouette -->
    <use href="#cloud" transform="translate(4 9)" fill="#0e1226" opacity="0.4" filter="url(#drop)"/>
    <use href="#cloud" fill="url(#face)"/>
    <g clip-path="url(#cloudClip)">
      <use href="#cloud" transform="translate(-3 -3)" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6" filter="url(#soft)"/>
      <use href="#cloud" transform="translate(3 3)" fill="none" stroke="#7b869e" stroke-opacity="0.6" stroke-width="6" filter="url(#soft)"/>
    </g>
  </g>
</svg>
